<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Premium Beauty Products</title>
  <link rel="stylesheet" href="style/style.css">
  <link rel="stylesheet" href="style/clear-list.css">
  <link rel="stylesheet" href="style/compound.css">
  <link rel="stylesheet" href="style/container.css">
  <link rel="stylesheet" href="style/title.css">
  <link rel="stylesheet" href="style/card.css">
  <link rel="stylesheet" href="style/products.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

</head>
<body>
  <main class="main">
<!--<button class="btn-toggle">Переключить цвет</button>
    <button class="btn-message">Открыть сообщение</button>
    <button class="btn-google">поискать в гугле</button>
    <button id="repaint-card-button">Перекрасить карточки</button>-->
    <div class="container">
      <h1 class="title">Выбери свой продукт</h1>
        <ul id="card-list" class="products clear-list"></ul>

        <template id ="card-template">
          <li class="products__item card">
            <img src="" alt="" class="card__image">
            <span class="card__category"></span>
            <h2 class="card__name"></h2>
            <p class="card__description"></p>

            <div class="card__compound compound">
              <span class="compound__name">Состав:</span>
              <ul class="compound__list"></ul>
            </div>

            <div class="card__footer">
              <div class="card__price">
                <b>Цена</b>
                <span class="card__price-value"></span>
              </div>
              <button class="card__button">купить</button>
            </div>
          </li> 
        </template>
    </div>
  </main>

  <script src="main.js"></script>
  <script src="homework-7.js"></script>
  <script src="homework-8.js"></script>
  <script type="module" src="homework-9.js"></script>
  <script type="module" src="homework-10.js"></script>

</body>
</html>
